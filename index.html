<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voter ID Demo Print</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  padding: 15px;
}
.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 18px;
  border-radius: 10px;
}
input, select, textarea, button {
  width: 100%;
  padding: 10px;
  margin: 7px 0;
  box-sizing: border-box;
}
button {
  background: #176b45;
  color: white;
  border: none;
  border-radius: 5px;
  font-size: 16px;
}
.card {
  margin-top: 20px;
  padding: 15px;
  border: 2px solid #777;
  background: white;
  position: relative;
  overflow: hidden;
}
.card h3 {
  text-align: center;
  color: #176b45;
}
.details {
  display: flex;
  gap: 12px;
}
#preview {
  width: 100px;
  height: 120px;
  object-fit: cover;
  border: 1px solid #aaa;
}
.demo {
  color: #c62828;
  font-weight: bold;
  text-align: center;
}
@media print {
  body * { visibility: hidden; }
  #card, #card * { visibility: visible; }
  #card {
    position: absolute;
    left: 0;
    top: 0;
    width: 85mm;
    box-sizing: border-box;
  }
  .demo { color: #c62828 !important; }
}
</style>
</head>

<body>
<div class="container">
<h2>Voter ID Demo Card</h2>

<input id="name" placeholder="पूरा नाम">
<input id="father" placeholder="पिता/माता/पति का नाम">
<input id="dob" type="date" aria-label="जन्मतिथि">

<select id="gender">
<option value="">लिंग चुनें</option>
<option>पुरुष</option>
<option>महिला</option>
<option>अन्य</option>
</select>

<textarea id="address" placeholder="पूरा पता"></textarea>

<label>अपनी फोटो चुनें:</label>
<input type="file" id="photo" accept="image/*">

<button onclick="makeCard()">कार्ड तैयार करें</button>

<div id="card" class="card">
  <h3>VOTER ID — DEMO</h3>
  <p class="demo">SAMPLE ONLY — NOT A GOVERNMENT ID</p>
  <div class="details">
    <div>
      <p><b>नाम:</b> <span id="pname">—</span></p>
      <p><b>पिता/माता/पति:</b> <span id="pfather">—</span></p>
      <p><b>जन्मतिथि:</b> <span id="pdob">—</span></p>
      <p><b>लिंग:</b> <span id="pgender">—</span></p>
    </div>
    <img id="preview" alt="चुनी गई फोटो">
  </div>
  <p><b>पता:</b> <span id="paddress">—</span></p>
</div>

<button onclick="window.print()">Print / Save as PDF</button>
</div>

<script>
function makeCard() {
  document.getElementById("pname").textContent =
    document.getElementById("name").value || "—";
  document.getElementById("pfather").textContent =
    document.getElementById("father").value || "—";
  document.getElementById("pdob").textContent =
    document.getElementById("dob").value || "—";
  document.getElementById("pgender").textContent =
    document.getElementById("gender").value || "—";
  document.getElementById("paddress").textContent =
    document.getElementById("address").value || "—";

  const file = document.getElementById("photo").files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById("preview").src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
}
</script>
</body>
</html>
